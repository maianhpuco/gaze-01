# ──────────────────────────────────────────────────────────────────────────────
# File: configs/example.yaml  (copy & adapt)
# ──────────────────────────────────────────────────────────────────────────────
# SIGMA (sequence‑first multimodal RNN) config for EGD‑CXR
# Save as, e.g., configs/st_tmrnn.yaml and run:  python main_train.py --config configs/st_tmrnn.yaml

dataset_name: "egd-cxr"

input_path:
  gaze_raw: /project/hnguyen2/mvu9/datasets/gaze_data/physionet.org/files/egd-cxr/1.0.0
  dicom_raw: /project/hnguyen2/mvu9/datasets/gaze_data/egd-cxr/dicom_raw
  segmentation_dir: /project/hnguyen2/mvu9/datasets/gaze_data/physionet.org/files/egd-cxr/1.0.0/audio_segmentation_transcripts
  transcripts_dir: /project/hnguyen2/mvu9/datasets/gaze_data/egd-cxr/transcripts

split_files:
  dir: configs/splits   # expects train_ids.txt / val_ids.txt (one dicom_id per line); falls back to 80/20 split

train:
  classes: ["CHF", "pneumonia", "Normal"]
  batch_size: 16
  epochs: 20
  max_fixations: 8
  num_workers: 2
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  patience: 10
  use_weighted_sampler: true
  lambda_txt: 1.0
  max_txt_len: 64

model:
  d_g: 64     # gaze dim
  d_s: 64     # segmentation/box (roi) dim
  d_img: 128  # image projected dim
  d_h: 256    # GRU hidden dim

output_path:
  checkpoint_dir: runs/checkpoints
  best_ckpt_name: tmrnn_egd_cxr_best_gold_gr.pt
