  num_workers: 4
  seed: 42
  checkpoint_dir: runs/checkpoints_st2
  use_bbox: true
  use_seg: true
  use_image: true
  use_text: true
  encoder_dropout: 0.1
  label_dropout: 0.25
  threshold_grid:
